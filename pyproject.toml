[project]
name = "farmwise-backend"
version = "0.1.0"
description = "FarmWise Backend API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "motor>=3.3.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "bcrypt>=4.1.0",
    "python-jose[cryptography]>=3.3.0",
    "Pillow>=10.0.0",
    "google-genai>=0.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
]

[tool.vercel]
entrypoint = "api.index:app"
