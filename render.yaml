services:
  - type: web
    name: farmwise-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: "FarmWise"
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_PASS
        sync: false
